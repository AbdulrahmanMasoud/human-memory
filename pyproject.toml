[project]
name = "memory-system"
version = "1.0.0"
description = "Human-Like Memory System for AI Agents based on ACT-R Cognitive Architecture"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",

    # Database - PostgreSQL
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.15.0",

    # Vector database - Qdrant
    "qdrant-client>=1.13.0",

    # Graph database - Neo4j
    "neo4j>=5.27.0",

    # Cache & message broker
    "redis>=5.0.0",

    # Task queue
    "celery[redis]>=5.4.0",

    # HTTP client (for external embedding APIs)
    "httpx>=0.28.0",

    # Settings & validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # Utilities
    "numpy>=2.0.0",
]

[project.optional-dependencies]
neo4j = [
    "neo4j>=5.27.0",
]
emotion = [
    "transformers>=4.48.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no external services)",
    "integration: Integration tests (require Docker services)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
